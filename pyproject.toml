[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "cloudflare-compose"
version = "0.2.0"
description = "Local MCP infrastructure connector for Cloudflare and Compose over SSH"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.28,<1"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
cloudflare-compose = "cloudflare_compose.server:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
